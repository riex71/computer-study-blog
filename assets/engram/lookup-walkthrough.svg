<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">Engram의 조회 경로를 따라가기</title><desc id="desc">정규화된 토큰 ID 7, 11, 5에서 2-gram과 3-gram을 만들고 여러 주소로 메모리를 조회한 뒤 현재 문맥으로 반영량을 정한다. 설명용 모식도이며 실제 모델의 토큰 ID나 해시 함수가 아니다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#63796a"/></marker></defs>
<rect width="960" height="450" fill="#fff"/><g font-family="Noto Sans KR,Arial,sans-serif" font-weight="400" fill="#27382d">
<text x="36" y="40" font-size="20">하나의 위치에서 조회와 결합이 일어나는 순서</text><text x="36" y="69" font-size="13" fill="#69766c">토큰 ID와 주소는 설명용 가상 예제</text>
<g stroke="#b5c4b8" fill="#f4f7f3"><rect x="36" y="106" width="224" height="94" rx="6"/><rect x="308" y="106" width="238" height="94" rx="6"/><rect x="594" y="106" width="330" height="94" rx="6"/><rect x="308" y="282" width="238" height="102" rx="6"/><rect x="594" y="282" width="330" height="102" rx="6"/></g>
<g font-size="16"><text x="54" y="134">정규화된 token IDs</text><text x="54" y="171" font-family="monospace">7 → 11 → 5</text><text x="326" y="134">현재 위치에서 끝나는 묶음</text><text x="326" y="163">2-gram: (11, 5)</text><text x="326" y="187">3-gram: (7, 11, 5)</text><text x="612" y="134">각 길이의 여러 해시 head로 조회</text><text x="612" y="163">주소 → 테이블의 학습된 벡터</text><text x="612" y="187">조회 결과를 이어 붙여 memory 구성</text><text x="326" y="315">현재 문맥의 hidden state</text><text x="326" y="349" fill="#63796a">같은 주소여도 문맥은 다름</text><text x="612" y="315">key · value 투영과 문맥 게이트</text><text x="612" y="345">반영량 조절 → 짧은 convolution</text><text x="612" y="371">Transformer 은닉 상태에 합치기</text></g>
<g fill="none" stroke="#63796a" stroke-width="2" marker-end="url(#arrow)"><path d="M260 153H298"/><path d="M546 153H584"/><path d="M759 200V270"/><path d="M546 333H584"/></g><text x="36" y="425" font-size="13" fill="#69766c">Studybase · Cheng et al. §2를 읽기 위한 설명용 도식. 원 논문 Figure를 재현한 그림은 아님.</text></g></svg>
