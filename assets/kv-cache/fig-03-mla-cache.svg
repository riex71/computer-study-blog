<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="665" version="1.1" viewBox="0 0 1260 665" width="1260" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F5F8FD" height="665" rx="22" width="1260" x="0" y="0" /><text fill="#14233D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="30" font-weight="bold" x="46" y="60">MLA: K·V를 따로 캐싱하지 않고, 공통 latent를 저장한다</text><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="16" x="48" y="91">DeepSeek-V2 (§2.1)의 핵심 저장 경로. 색으로 강조한 두 벡터가 토큰마다 캐시에 남는다</text><rect fill="#FFFFFF" height="420" rx="18" stroke="#D9E3EF" stroke-width="2" width="250" x="41" y="126" /><rect fill="#FFF1E5" height="36" rx="18" stroke="#FFF1E5" stroke-width="0" width="142" x="70" y="147" /><text fill="#EA7E3D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="141.0" y="172">현재 토큰</text><rect fill="#FFF1E5" height="78" rx="12" stroke="#EA7E3D" stroke-width="1.5" width="176" x="78" y="229" /><text fill="#EA7E3D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="29" font-weight="bold" text-anchor="middle" x="166" y="277">h_t</text><line stroke="#EA7E3D" stroke-linecap="round" stroke-width="3" x1="166" x2="166" y1="308" y2="362" /><polygon fill="#EA7E3D" points="166,362 161.51463501634473,351.9560216565646 170.48536498365527,351.9560216565646" /><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="16" text-anchor="middle" x="165" y="407">선형 투영으로 두 경로 생성</text><rect fill="#FFFFFF" height="420" rx="18" stroke="#D9E3EF" stroke-width="2" width="455" x="319" y="126" /><text fill="#14233D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="24" font-weight="bold" x="340" y="165">캐시에 저장되는 값</text><rect fill="#DFF8F4" height="115" rx="15" stroke="#0D9488" stroke-width="2" width="412" x="341" y="215" /><text fill="#0D9488" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="23" font-weight="bold" x="360" y="260">Content: c_t^KV</text><text fill="#0D9488" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" x="360" y="290">512차원 latent</text><rect fill="#EEE8FB" height="114" rx="15" stroke="#7754C7" stroke-width="2" width="412" x="341" y="359" /><text fill="#7754C7" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="23" font-weight="bold" x="360" y="403">Position: k_t^R (RoPE)</text><text fill="#7754C7" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" x="360" y="434">64차원 공유 key</text><line stroke="#0D9488" stroke-linecap="round" stroke-width="3" x1="291" x2="340" y1="266" y2="267" /><polygon fill="#0D9488" points="340,267 329.8665936230525,271.2794947364893 330.04963163176603,262.31063230952736" /><line stroke="#7754C7" stroke-linecap="round" stroke-width="3" x1="291" x2="339" y1="291" y2="413" /><polygon fill="#7754C7" points="339,413 331.148727436034,405.29561688865914 339.49658330548453,402.0112145793671" /><rect fill="#FFFFFF" height="420" rx="18" stroke="#D9E3EF" stroke-width="2" width="408" x="803" y="126" /><text fill="#14233D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="24" font-weight="bold" x="828" y="165">Attention 계산</text><rect fill="#E6F1FE" height="93" rx="12" stroke="#2773CD" stroke-width="1.5" width="357" x="829" y="216" /><text fill="#2773CD" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="1007" y="251">현재 Query + 캐시된 latent</text><text fill="#2773CD" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle" x="1007" y="280">projection 흡수로 K·V 복원 부담 완화</text><rect fill="#FFFFFF" height="123" rx="12" stroke="#D9E3EF" stroke-width="1.7" width="357" x="829" y="349" /><text fill="#14233D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="1007" y="390">내용 성분 + 위치 성분</text><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="16" text-anchor="middle" x="1007" y="424">Attention score와 출력을 계산</text><line stroke="#0D9488" stroke-linecap="round" stroke-width="3" x1="774" x2="827" y1="269" y2="269" /><polygon fill="#0D9488" points="827,269 816.9560216565646,273.48536498365524 816.9560216565646,264.51463501634476" /><line stroke="#7754C7" stroke-linecap="round" stroke-width="3" x1="774" x2="827" y1="415" y2="412" /><polygon fill="#7754C7" points="827,412 817.2255563142628,417.04581516054157 816.7185906525491,408.08942180360117" /><line stroke="#0D9488" stroke-dasharray="6,7" stroke-linecap="round" stroke-width="2" x1="341" x2="753" y1="497" y2="497" /><text fill="#14233D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="629" y="588">추론 캐시 총합: (512 + 64) × 층 수 × 토큰 수 × dtype 크기</text><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle" x="629" y="619">Query 압축은 여기서 생략 · 수치는 DeepSeek-V2의 설정, 전체 블록의 모든 연산을 그린 것은 아님</text></svg>