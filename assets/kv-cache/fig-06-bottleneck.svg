<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="560" version="1.1" viewBox="0 0 1260 560" width="1260" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F5F8FD" height="560" rx="22" width="1260" x="0" y="0" /><text fill="#14233D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="30" font-weight="bold" x="46" y="60">메모리 절감과 속도 향상은 같은 말일까?</text><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="16" x="48" y="91">Decode에서는 토큰마다 캐시를 읽는 비용이 중요하지만, 실제 속도는 하드웨어와 구현에 달린다</text><rect fill="#FFFFFF" height="327" rx="19" stroke="#D9E3EF" stroke-width="2" width="368" x="45" y="133" /><rect fill="#E6F1FE" height="36" rx="18" stroke="#E6F1FE" stroke-width="0" width="150" x="68" y="155" /><text fill="#2773CD" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="143.0" y="180">저장 공간</text><rect fill="#FFFFFF" height="327" rx="19" stroke="#D9E3EF" stroke-width="2" width="368" x="445" y="133" /><rect fill="#DFF8F4" height="36" rx="18" stroke="#DFF8F4" stroke-width="0" width="150" x="468" y="155" /><text fill="#0D9488" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="543.0" y="180">메모리 읽기</text><rect fill="#FFFFFF" height="327" rx="19" stroke="#D9E3EF" stroke-width="2" width="368" x="845" y="133" /><rect fill="#FFF1E5" height="36" rx="18" stroke="#FFF1E5" stroke-width="0" width="150" x="868" y="155" /><text fill="#EA7E3D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="943.0" y="180">실제 지연시간</text><text fill="#2773CD" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="229" y="261">Cache bytes</text><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" text-anchor="middle" x="229" y="309">문맥 길이·배치·KV head에 비례</text><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" text-anchor="middle" x="229" y="353">정해진 텐서 크기를 계산</text><text fill="#0D9488" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" x="629" y="261">HBM traffic</text><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" text-anchor="middle" x="629" y="309">필요한 K·V를 토큰마다 읽음</text><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" text-anchor="middle" x="629" y="353">캐시·타일링·압축에 따라 차이</text><text fill="#EA7E3D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" x="1029" y="261">Latency / throughput</text><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" text-anchor="middle" x="1029" y="309">weight 읽기·compute·batching</text><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" text-anchor="middle" x="1029" y="353">kernel·GPU에 따라 변화</text><line stroke="#0D9488" stroke-linecap="round" stroke-width="3" x1="416" x2="443" y1="291" y2="291" /><polygon fill="#0D9488" points="443,291 432.9560216565646,295.48536498365524 432.9560216565646,286.51463501634476" /><line stroke="#EA7E3D" stroke-linecap="round" stroke-width="3" x1="816" x2="843" y1="291" y2="291" /><polygon fill="#EA7E3D" points="843,291 832.9560216565646,295.48536498365524 832.9560216565646,286.51463501634476" /><text fill="#14233D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="21" font-weight="bold" text-anchor="middle" x="629" y="512">캐시 75% 감소 ≠ 실행 시간 75% 감소</text></svg>