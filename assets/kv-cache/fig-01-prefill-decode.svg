<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="600" version="1.1" viewBox="0 0 1280 600" width="1280" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#F5F8FD" height="600" rx="22" width="1280" x="0" y="0" /><text fill="#14233D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="30" font-weight="bold" x="46" y="60">KV Cache의 탄생: Prefill과 Decode</text><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="16" x="48" y="91">자기회귀 추론에서 과거 K·V를 저장하고 매 토큰마다 재사용한다</text><rect fill="#FFFFFF" height="394" rx="16" stroke="#D9E3EF" stroke-width="2" width="560" x="44" y="123" /><rect fill="#FFFFFF" height="394" rx="16" stroke="#D9E3EF" stroke-width="2" width="605" x="628" y="123" /><rect fill="#E6F1FE" height="36" rx="18" stroke="#E6F1FE" stroke-width="0" width="150" x="64" y="141" /><text fill="#2773CD" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="139.0" y="166">1  PREFILL</text><rect fill="#DFF8F4" height="36" rx="18" stroke="#DFF8F4" stroke-width="0" width="150" x="646" y="141" /><text fill="#0D9488" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="721.0" y="166">2  DECODE</text><text fill="#14233D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="22" font-weight="bold" x="74" y="221">프롬프트 5개 토큰을 처리</text><rect fill="#E6F1FE" height="60" rx="11" stroke="#2773CD" stroke-width="1.5" width="86" x="74" y="251" /><text fill="#2773CD" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="117" y="289">나는</text><rect fill="#E6F1FE" height="60" rx="11" stroke="#2773CD" stroke-width="1.5" width="86" x="171" y="251" /><text fill="#2773CD" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="214" y="289">오늘</text><rect fill="#E6F1FE" height="60" rx="11" stroke="#2773CD" stroke-width="1.5" width="86" x="268" y="251" /><text fill="#2773CD" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="311" y="289">LLM</text><rect fill="#E6F1FE" height="60" rx="11" stroke="#2773CD" stroke-width="1.5" width="86" x="365" y="251" /><text fill="#2773CD" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="408" y="289">을</text><rect fill="#E6F1FE" height="60" rx="11" stroke="#2773CD" stroke-width="1.5" width="86" x="462" y="251" /><text fill="#2773CD" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="505" y="289">공부한다</text><line stroke="#2773CD" stroke-linecap="round" stroke-width="3" x1="344" x2="344" y1="321" y2="367" /><polygon fill="#2773CD" points="344,367 339.51463501634476,356.9560216565646 348.48536498365524,356.9560216565646" /><rect fill="#E6F1FE" height="85" rx="14" stroke="#2773CD" stroke-width="1.4" width="446" x="101" y="384" /><text fill="#2773CD" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="324" y="421">각 층의 Key / Value를 계산</text><text fill="#2773CD" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="18" text-anchor="middle" x="324" y="448">→ KV Cache에 기록</text><text fill="#14233D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="22" font-weight="bold" x="668" y="225">새 입력 토큰</text><rect fill="#DFF8F4" height="61" rx="12" stroke="#0D9488" stroke-width="1.8" width="140" x="688" y="248" /><text fill="#0D9488" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" x="758" y="287">새 토큰</text><line stroke="#0D9488" stroke-linecap="round" stroke-width="3" x1="836" x2="891" y1="278" y2="278" /><polygon fill="#0D9488" points="891,278 880.9560216565646,282.48536498365524 880.9560216565646,273.51463501634476" /><rect fill="#FFFFFF" height="70" rx="13" stroke="#0D9488" stroke-width="1.5" width="283" x="896" y="245" /><text fill="#0D9488" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="1037" y="288">Q 생성 + 현재 K·V 추가</text><rect fill="#EEE8FB" height="114" rx="14" stroke="#7754C7" stroke-width="1.5" width="509" x="670" y="356" /><text fill="#7754C7" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="922" y="397">기존 토큰의 K·V를 불러와 attention 수행</text><text fill="#54627A" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="16" text-anchor="middle" x="922" y="434">과거 K·V의 재계산을 피하지만 읽기·저장 비용이 든다</text><line stroke="#7754C7" stroke-linecap="round" stroke-width="3" x1="1037" x2="1037" y1="315" y2="354" /><polygon fill="#7754C7" points="1037,354 1032.5146350163448,343.9560216565646 1041.4853649836552,343.9560216565646" /><line stroke="#0D9488" stroke-linecap="round" stroke-width="3" x1="602" x2="637" y1="347" y2="347" /><line stroke="#0D9488" stroke-linecap="round" stroke-width="3" x1="637" x2="683" y1="347" y2="401" /><polygon fill="#0D9488" points="683,401 673.0723632334417,396.26269821192705 679.9012706935811,390.4454807458823" /><text fill="#0D9488" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" x="621" y="330">재사용</text><text fill="#14233D" font-family="NanumGothic, Noto Sans CJK KR, sans-serif" font-size="18" font-weight="bold" x="640" y="554">토큰이 길어질수록 캐시가 선형으로 증가</text></svg>